name: Android CI/CD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Gomin (Universal APK + Release)
      env:
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: |
        ./gradlew :TMessagesProj_AppStandalone:assembleStandalone \
          --no-daemon \
          --stacktrace \
          -Dorg.gradle.workers.max=4 \
          -Dorg.gradle.jvmargs="-Xmx6g -XX:+HeapDumpOnOutOfMemoryError"

    - name: Find and Prepare APK
      id: find_apk
      run: |
        # Знайти універсальний apk
        APK_PATH=$(find . -name "*universal.apk" | head -n 1)
        if [ -z "$APK_PATH" ]; then
          # Якщо універсального немає, беремо будь-який релізний
          APK_PATH=$(find . -name "*.apk" | grep "standalone" | head -n 1)
        fi
        
        if [ -z "$APK_PATH" ]; then
          echo "Error: APK not found!"
          exit 1
        fi
        echo "Found APK at: $APK_PATH"
        cp "$APK_PATH" gomin-release.apk
        echo "apk_path=gomin-release.apk" >> $GITHUB_OUTPUT

    - name: Create Rolling Release
      id: create_release
      uses: ncipollo/release-action@v1
      with:
        tag: "latest-release"
        name: "Gomin - Останній білд (Release)"
        body: "Універсальний підписаний APK для Pixel 7a та інших пристроїв. Коміт: ${{ github.sha }}"
        artifacts: "gomin-release.apk"
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: true
        makeLatest: true
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Send Success Notification
      if: success()
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        RESULT_URL="https://github.com/${{ github.repository }}/releases/tag/latest-release"
        COMMIT_MSG=$(git log -1 --pretty=%s)
        ESCAPED_MSG=$(echo "$COMMIT_MSG" | sed 's/[_*-`>#+|{}.!\\-]/\\&/g')
        ESCAPED_BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[_*-`>#+|{}.!\\-]/\\&/g')
        
        MESSAGE="📦 *Gomin Build Notification* 🚀%0A%0AСтатус: ✅ *Успішно*%0AГілка: \`${ESCAPED_BRANCH}\`%0AКоміт: \`${ESCAPED_MSG}\`%0A%0A[📦 Завантажити APK з Релізу]($RESULT_URL)"
        
        curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -d "chat_id=${CHAT_ID}" \
          -d "text=${MESSAGE}" \
          -d "parse_mode=MarkdownV2"

    - name: Send Failure Notification
      if: failure()
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        LOG_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        COMMIT_MSG=$(git log -1 --pretty=%s)
        ESCAPED_MSG=$(echo "$COMMIT_MSG" | sed 's/[_*-`>#+|{}.!\\-]/\\&/g')
        ESCAPED_BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[_*-`>#+|{}.!\\-]/\\&/g')
        
        MESSAGE="⚠️ *Gomin Build Notification* ❌%0A%0AСтатус: ❌ *Помилка*%0AГілка: \`${ESCAPED_BRANCH}\`%0AКоміт: \`${ESCAPED_MSG}\`%0A%0A[🔍 Подивитись логи]($LOG_URL)"
        
        curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -d "chat_id=${CHAT_ID}" \
          -d "text=${MESSAGE}" \
          -d "parse_mode=MarkdownV2"
