name: Android CI/CD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

         - name: Set up Swap Space
                 uses: pierotofy/set-swap-space@master
                         with:
                                   swap-size-gb: 6
                                   
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Install NDK
      run: |
        echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"
        echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/21.4.7075529" >> $GITHUB_ENV

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK (Pixel 7a Optimized)
      run: |
        ./gradlew :TMessagesProj_AppStandalone:assembleDebug \
          -Pandroid.injected.abi=arm64-v8a \
          --no-daemon \
          --stacktrace \
          -Dorg.gradle.workers.max=2 \
          -Dorg.gradle.jvmargs="-Xmx3g -XX:+HeapDumpOnOutOfMemoryError"

    - name: Find and Rename APK
      run: |
        APK_PATH=$(find TMessagesProj_AppStandalone/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
        cp "$APK_PATH" gomin-debug.apk
        echo "APK_FILE=gomin-debug.apk" >> $GITHUB_ENV

    - name: Upload Rolling Release
      uses: ncipollo/release-action@v1
      with:
        tag: "latest-debug"
        name: "Gomin - Останній білд (Debug)"
        body: "Це автоматично оновлюваний білд для тестування на Pixel 7a. Дата збірки: ${{ github.event.head_commit.timestamp }}"
        artifacts: "gomin-debug.apk"
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: true
        makeLatest: true
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify Telegram
      run: |
        APK_URL="https://github.com/${{ github.repository }}/releases/download/latest-debug/gomin-debug.apk"
        MESSAGE="📦 *Gomin Build Ready!*%0A%0A🚀 *Version:* 1.0.0%0A📅 *Date:* ${{ github.event.head_commit.timestamp }}%0A🔗 [Download APK]($APK_URL)"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=$MESSAGE" \
          -d "parse_mode=Markdown"
